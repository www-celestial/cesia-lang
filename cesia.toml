# The tasks of this repository: cesia do lists them.
[project]
name = "cesia"
src = []          # its code is OCaml, and its libraries are std/: no package of its own
native = ["SDL3", "SDL3_ttf"]

# cesia doc --site: its pages link each name to the line that defines it.
[site]
title = "Cesia"
source = "https://github.com/www-celestial/cesia-lang/blob/main/src/"

[tasks.build]
run = ["dune", "build", "--profile", "release"]

[tasks.test]
run = ["tools/test.sh"]

[tasks.check]
run = ["tools/check.sh"]

[tasks.demo]
needs = ["build"]
file = "examples/window.ce"

[tasks.material]
needs = ["build"]
file = "examples/material.ce"
