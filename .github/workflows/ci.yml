name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev libsodium-dev
      - name: Libraries on macOS
        if: runner.os == 'macOS'
        run: |
          brew install libffi libsodium openssl@3 coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: opam install -y dune
      - run: opam exec -- dune build
      # The JIT is a plugin (natdynlink: flexdll on Windows): the binary must load it, and run fib natively.
      - name: JIT plugin
        shell: bash
        run: |
          CESIA_JIT=always CESIA_JIT_SHOW=1 _build/default/src/bin/main.exe run bench/fib.ce > out.txt 2> jit.txt
          grep -q '^jit: loaded' jit.txt || { cat jit.txt; exit 1; }
          grep -qx 9227465 out.txt
      - name: JIT on Windows
        if: runner.os == 'Windows'
        run: opam exec -- dune exec tests/jit_test.exe
      - name: Tests
        if: runner.os != 'Windows'
        timeout-minutes: 10
        env:
          GOLDEN_TRACE: 1
        run: opam exec -- tools/test.sh
