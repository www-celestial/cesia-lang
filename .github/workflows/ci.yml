name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev libsodium-dev
      - name: Libraries on macOS
        if: runner.os == 'macOS'
        run: |
          brew install libffi libsodium openssl@3 coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: opam install -y dune
      - run: opam exec -- dune build
      # The JIT is a plugin (natdynlink: flexdll on Windows): the binary must load it, and run fib natively.
      - name: JIT plugin
        shell: bash
        run: |
          status=0
          CESIA_JIT=always CESIA_JIT_SHOW=1 _build/default/src/bin/main.exe run bench/fib.ce > out.txt 2> jit.txt || status=$?
          echo "exit $status" >> jit.txt
          # Windows ends a line with CR LF. On arm64 the JIT is off for now: fib runs interpreted.
          want='^jit: loaded'
          [ "$RUNNER_ARCH" = ARM64 ] && want='^jit: off on arm64'
          grep -q "$want" jit.txt || { echo "no line $want" | tee -a jit.txt; exit 1; }
          tr -d '\r' < out.txt | grep -qx 9227465 || { echo "out.txt isn't 9227465" | tee -a jit.txt; exit 1; }
      - name: JIT on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: opam exec -- dune exec tests/jit_test.exe 2>&1 | tee jit-test.log
      - name: Tests
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        env:
          GOLDEN_TRACE: 1
        run: opam exec -- tools/test.sh 2>&1 | tee test.log
      # The logs need an account to be read; an annotation doesn't, for a public repository.
      - name: Report a failure
        if: failure()
        shell: bash
        run: tools/ci-error.sh out.txt jit.txt jit-test.log test.log

  # The client of std/websocket against Autobahn|Testsuite, the reference suite of RFC 6455, whose fuzzing server runs in
  # Docker, which the Linux runners have. Left out: 1.2.* and the binary cases of 9.*, binary messages, which the client
  # doesn't send; 12.* and 13.*, compression (RFC 7692), which it doesn't do. The 9.* cases, large messages and many of
  # them, run apart: their durations are the client's speed.
  autobahn:
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: protocol
            cases: '["*"]'
            exclude: '["1.2.*", "9.*", "12.*", "13.*"]'
          - part: limits
            cases: '["9.*"]'
            exclude: '["9.2.*", "9.4.*", "9.6.*", "9.8.*"]'
    name: autobahn (${{ matrix.part }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - run: sudo apt-get update && sudo apt-get install -y libffi-dev libsodium-dev
      - run: opam install -y dune
      - run: opam exec -- dune build --profile release
      - name: Fuzzing server
        run: |
          mkdir -p config reports
          echo '{"url": "ws://127.0.0.1:9001", "outdir": "./reports/clients", "cases": ${{ matrix.cases }},
            "exclude-cases": ${{ matrix.exclude }}, "exclude-agent-cases": {}}' > config/fuzzingserver.json
          docker run -d -v "$PWD/config:/config" -v "$PWD/reports:/reports" -p 9001:9001 --name fuzzingserver \
            crossbario/autobahn-testsuite:25.10.1@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074
          # Docker takes the port before the server inside listens: wait for an HTTP answer, any.
          for _ in $(seq 1 60); do curl -s -o /dev/null --max-time 2 http://127.0.0.1:9001/ && exit 0; sleep 1; done
          docker logs fuzzingserver
          exit 1
      - name: Cases
        timeout-minutes: 30
        run: _build/default/src/bin/main.exe run --allow net=127.0.0.1:9001,read=reports tools/autobahn.ce
      - name: Server log
        if: failure()
        run: docker logs fuzzingserver
