name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev libsodium-dev
      - name: Libraries on macOS
        if: runner.os == 'macOS'
        run: brew install libffi libsodium
      - run: opam install -y dune
      - run: opam exec -- dune build
      - name: Tests
        if: runner.os != 'Windows'
        run: opam exec -- tools/test.sh
