name: pages

# The site of Cesia, its book and its reference, as cesia doc --site makes them: built for each push to main and each
# pull request, as a check, and published on GitHub Pages once the release of a tag vX.Y.Z is out, from that tag, so that
# the site is the documentation of the version people install, with its number. It runs then from main, the one branch
# GitHub lets publish Pages unless told otherwise. A block of the book that gives another value, or a [Name] that leads
# nowhere, stops the build, and the site in place stays as it was.
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # After a release: only one made by a tag, which succeeded; the nightly, run by hand, publishes no site.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      # SQLite for the chapters on it, and the libraries the reference's own examples load.
      - run: sudo apt-get update && sudo apt-get install -y libffi-dev libsodium-dev libsqlite3-0
      - run: opam install -y dune
      # The site shows the version that built it: a release's own number, without +dev. Its links to the sources lead to that
      # tag, whose lines are the ones the pages name: main moves on.
      - name: The version of this build
        if: github.event_name == 'workflow_run'
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is no tag of a release."; exit 1; }
          sed -e 's/+dev"$/"/' src/lib/version.ml > version.ml.new && mv version.ml.new src/lib/version.ml
          grep '^let text' src/lib/version.ml
          sed -e "s#/blob/main/#/blob/$TAG/#" cesia.toml > cesia.toml.new && mv cesia.toml.new cesia.toml
          grep '^source' cesia.toml
      # The binary, and the plugins it loads from its build: the JIT, and SQLite's natives.
      - run: opam exec -- dune build --profile release ./src/bin/main.exe ./src/jit/cesia_jit.cmxs ./src/sqlite/cesia_sqlite.cmxs ./src/debug/cesia_debug.cmxs
      - name: Site
        run: _build/default/src/bin/main.exe doc --site _site
      # What the build keeps for itself: the programs of the book's pages and their folders, and what lets the next build
      # skip a page that didn't change.
      - name: Only the pages
        run: rm -rf _site/.run _site/.pages _site/.reference _site/.book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_run'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
