name: pages

# The site of Cesia, its book and its reference, as cesia doc --site makes them from this commit: built for each pull
# request, and published on GitHub Pages from main. A block of the book that gives another value, or a [Name] that leads
# nowhere, stops the build, and the site in place stays as it was.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      # SQLite for the chapters on it, and the libraries the reference's own examples load.
      - run: sudo apt-get update && sudo apt-get install -y libffi-dev libsodium-dev libsqlite3-0
      - run: opam install -y dune
      # The binary, and the plugins it loads from its build: the JIT, and SQLite's natives.
      - run: opam exec -- dune build --profile release ./src/bin/main.exe ./src/jit/cesia_jit.cmxs ./src/sqlite/cesia_sqlite.cmxs
      - name: Site
        run: _build/default/src/bin/main.exe doc --site _site
      # What the build keeps for itself: the programs of the book's pages and their folders, and what lets the next build
      # skip a page that didn't change.
      - name: Only the pages
        run: rm -rf _site/.run _site/.pages _site/.reference _site/.book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
