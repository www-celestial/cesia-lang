name: release

# A tag vX.Y.Z makes the release vX.Y.Z; the pre-release nightly is made again from main at each push there that changes
# more than the docs (or by hand, Run workflow on main), so that Cemacs and Cepheus, which build with the nightly, test and
# publish against main. Each build runs the tests first, and a failure publishes nothing.
# Each holds, for each system, an archive of bin/cesia and lib/ (the C libraries of tools/release-libs.sh) with its
# fingerprint in a .blake2 file, and the notes of tools/notes.sh. cesia upgrade reads them.
on:
  push:
    # A branch try/NAME builds and tests as main does, on every system, and publishes nothing: a change of this file or of
    # tools/release-libs.sh is seen working before it reaches main.
    branches: [main, "try/**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Only publish writes: the builds run the configure and make of downloaded sources.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # One system failing doesn't stop the others: each says what it lacks.
      fail-fast: false
      matrix:
        include:
          # The oldest Linux GitHub offers, so that the binary runs on older systems too.
          - { os: ubuntu-22.04, system: linux-x86_64, archive: tar.gz }
          - { os: macos-15, system: macos-arm64, archive: tar.gz }
          - { os: windows-latest, system: windows-x86_64, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Git on Windows ends each line with CR LF by default: the sed of the version would find nothing. Every system builds
      # the same files.
      - name: Files as they are stored
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: "5.5"
      # The C libraries of the last build with the same tools/release-libs.sh: they are built again only when it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: libraries
        with:
          path: libraries
          key: libraries-${{ matrix.system }}-${{ hashFiles('tools/release-libs.sh') }}
      # On Windows they are built by the compiler of MSYS2 for UCRT64, whose C runtime comes with Windows 10 and later, as
      # MSYS2 drops MINGW64. The binary keeps the C runtime of OCaml's toolchain: tls.ce gives OpenSSL only its own objects,
      # never a FILE or memory to free, and libsodium takes none. The runners no longer hold MSYS2.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows' && steps.libraries.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: make perl python curl unzip mingw-w64-ucrt-x86_64-gcc
      - name: Tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libsodium-dev patchelf
      - name: Tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew install libffi libsodium openssl@3 coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: opam install -y dune
      # The tests first, on the tree as it is, +dev: they check that form. tools/test.sh builds in the dev profile, so the
      # release build comes after it, and is what the archive holds.
      - name: Tests
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: opam exec -- tools/test.sh 2>&1 | tee test.log
      # The same tests on the other path of the engine.
      - name: Tests on the other path
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: opam exec -- tools/test.sh --no-spec 2>&1 | tee test-no-spec.log
      # The tests slow by nature, on both paths, which tools/check.sh runs before each commit: on Linux only, about two
      # minutes.
      - name: Slow tests
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: opam exec -- tools/test.sh --slow 2>&1 | tee test-slow.log
      - name: The version of this build
        run: |
          file=src/lib/version.ml
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            have=$(sed -n 's/^let text = "cesia \(.*\)+dev"$/\1/p' "$file")
            if [ "v$have" != "$GITHUB_REF_NAME" ]; then
              echo "The tag is $GITHUB_REF_NAME and $file says $have: run tools/release.sh first."
              exit 1
            fi
            sed -e 's/+dev"$/"/' "$file" > "$file.new"
          else
            sed -e "s/+dev\"\$/-nightly+$(git rev-parse --short HEAD)\"/" "$file" > "$file.new"
          fi
          mv "$file.new" "$file"
          grep '^let text' "$file"
      - run: opam exec -- dune build --profile release
      - name: The C libraries
        if: runner.os != 'Windows' && steps.libraries.outputs.cache-hit != 'true'
        run: bash -x tools/release-libs.sh ${{ matrix.system }} libraries 2>&1 | tee libs.log
      - name: The C libraries on Windows
        if: runner.os == 'Windows' && steps.libraries.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash -x tools/release-libs.sh ${{ matrix.system }} libraries 2>&1 | tee libs.log
      - name: The archive
        run: |
          # Each command it runs, for the annotation of a failure.
          exec > >(tee archive.log) 2>&1
          set -x
          mkdir -p out/bin
          cp -R libraries/lib out/lib
          # The plugins that the binary loads from lib/, the JIT at the first hot unit, SQLite's natives and the
          # debugger's engine at their first call, and the runner of cesia test; without the C debug info, as the binary.
          for plugin in jit/cesia_jit.cmxs sqlite/cesia_sqlite.cmxs testing/cesia_testing.cmxs debug/cesia_debug.cmxs; do
            cp "_build/default/src/$plugin" out/lib/
            file="out/lib/$(basename "$plugin")"
            # Dune's files are read-only, and so is their copy: strip writes it.
            chmod u+w "$file"
            if [ "${{ runner.os }}" = macOS ]; then
              strip -x "$file" && codesign --force -s - "$file"
            else
              opam exec -- strip --strip-debug "$file"
            fi
          done
          if [ "${{ runner.os }}" = Windows ]; then
            cp _build/default/src/bin/main.exe out/bin/cesia.exe
            chmod u+w out/bin/cesia.exe
            # Without the C debug info, mostly MIR's: OCaml's backtraces don't need it. The version below runs the result.
            opam exec -- strip out/bin/cesia.exe
            # The DLLs the binary itself was linked with, from the toolchain of OCaml: not those of Windows.
            # Windows's own DLLs and its API sets never go in: whatever shell finds them, in any case of letters.
            shopt -s nocasematch
            for dll in $(objdump -p out/bin/cesia.exe | awk '/DLL Name/ { print $3 }'); do
              case "$dll" in api-ms-win-* | ext-ms-win-*) continue ;; esac
              found=$(opam exec -- which "$dll" 2> /dev/null || true)
              case "$found" in "" | */windows/*) ;; *) cp "$found" out/bin/ ;; esac
            done
            shopt -u nocasematch
            out/bin/cesia.exe version
            CESIA_JIT=always CESIA_JIT_SHOW=1 out/bin/cesia.exe run bench/fib.ce 2> jit.txt
            grep -q '^jit: loaded' jit.txt || { cat jit.txt; exit 1; }
            tools/release-check.sh out/bin/cesia.exe
            (cd out && pwsh -Command "Compress-Archive -Path bin, lib -DestinationPath ../cesia-${{ matrix.system }}.zip")
          else
            cp _build/default/src/bin/main.exe out/bin/cesia
            chmod u+w out/bin/cesia
            # Without the C debug info, mostly MIR's; on macOS the signature that stripping breaks is made again.
            if [ "${{ runner.os }}" = macOS ]; then strip -x out/bin/cesia && codesign --force -s - out/bin/cesia; else strip out/bin/cesia; fi
            out/bin/cesia version | tee "version-${{ matrix.system }}.txt"
            # The stripped binary still loads its plugin; on arm64 the JIT is off for now.
            CESIA_JIT=always CESIA_JIT_SHOW=1 out/bin/cesia run bench/fib.ce 2> jit.txt
            want='^jit: loaded'
            [ "$RUNNER_ARCH" = ARM64 ] && want='^jit: off on arm64'
            grep -q "$want" jit.txt || { cat jit.txt; exit 1; }
            tools/release-check.sh out/bin/cesia
            tar -czf "cesia-${{ matrix.system }}.tar.gz" -C out bin lib
          fi
      # The logs need an account to be read; an annotation doesn't, for a public repository.
      - name: Report a failure
        if: failure()
        run: tools/ci-error.sh test.log test-no-spec.log test-slow.log libs.log archive.log jit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cesia-${{ matrix.system }}
          path: |
            cesia-${{ matrix.system }}.${{ matrix.archive }}
            version-*.txt

  publish:
    needs: build
    # A nightly comes from main only, never from another branch run by hand.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          merge-multiple: true
      - name: Fingerprints and notes
        run: |
          # .blake2 for cesia upgrade, .sha256 for install.sh and install.ps1: macOS and Windows can check it with no tool added.
          for f in assets/cesia-*; do
            echo "blake2:$(b2sum -l 256 "$f" | cut -d' ' -f1)" > "$f.blake2"
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          tools/notes.sh > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(cat assets/version-linux-x86_64.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A release is made only from a commit of main, whoever pushed the tag.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main." >&2; exit 1; }
            gh release create "$GITHUB_REF_NAME" assets/cesia-* --title "$title" --notes-file notes.md
          else
            git tag -f nightly
            git push -f origin nightly
            # The nightly stays in place while its files are replaced one by one, so that a download by Cemacs or Cepheus
            # never finds it missing.
            if gh release view nightly > /dev/null 2>&1; then
              gh release edit nightly --prerelease --title "$title" --notes-file notes.md
              gh release upload nightly assets/cesia-* --clobber
            else
              gh release create nightly assets/cesia-* --prerelease --title "$title" --notes-file notes.md
            fi
          fi
