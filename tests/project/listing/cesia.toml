[project]
name = "window"
native = ["SDL3", "SDL3_ttf"]

[tasks.build]
run = ["dune", "build", "--profile", "release"]

[tasks.test]
needs = ["build"]
run = ["tools/test.sh"]

[tasks.demo]
needs = ["build"]
file = "examples/window.ce"
limit = "memory=512M"

[tasks.dev]
file = "examples/window.ce"
watch = true

[tasks.mark]
run = ["touch", "ran.txt"]

[tasks.all]
needs = ["test", "demo"]
