[project]
name = "shop"
native = ["sodium"]

[tasks.build]
run = ["dune", "build", "--profile", "release"]

[tasks.test]
needs = ["build"]
run = ["tools/test.sh"]

[tasks.demo]
needs = ["build"]
file = "src/shop.ce"
limit = "memory=512M"

[tasks.dev]
file = "src/shop.ce"
watch = true

[tasks.mark]
run = ["touch", "ran.txt"]

[tasks.all]
needs = ["test", "demo"]
