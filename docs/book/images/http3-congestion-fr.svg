<svg xmlns="http://www.w3.org/2000/svg" width="760" height="502" viewBox="0 0 760 502">
<title>Le HTTP/3 de Cesia sur ngtcp2 : quel contrôle de congestion, selon le lien</title>
<style>text{font-family:system-ui, sans-serif;font-size:12px;fill:#1f2328}.h{font-weight:600;font-size:13px}.s{fill:#57606a}.r{stroke:#57606a;stroke-width:1.2}</style>
<rect width="760" height="502" fill="#fff"/>
<text class="h" x="16" y="24">Le HTTP/3 de Cesia sur ngtcp2 : quel contrôle de congestion, selon le lien</text>
<text class="s" x="16" y="42">un téléchargement de 1 Mo sur une nouvelle connexion, le client est quic-go ; médiane des tours, la ligne du plus court au plus long</text>
<text class="h" x="16" y="76">lien propre</text>
<text x="32" y="98">BBR</text>
<rect x="230" y="87" width="110.3" height="14" rx="2" fill="#1971c2" fill-opacity="0.25" stroke="#1971c2"/>
<line class="r" x1="318.6" y1="94" x2="560.0" y2="94"/>
<text x="566.0" y="98">26 ms</text>
<text x="32" y="118">CUBIC</text>
<rect x="230" y="107" width="102.4" height="14" rx="2" fill="#2f9e44" fill-opacity="0.25" stroke="#2f9e44"/>
<line class="r" x1="317.9" y1="114" x2="501.4" y2="114"/>
<text x="507.4" y="118">24 ms</text>
<text x="32" y="138">Reno</text>
<rect x="230" y="127" width="98.7" height="14" rx="2" fill="#e8590c" fill-opacity="0.25" stroke="#e8590c"/>
<line class="r" x1="316.5" y1="134" x2="412.1" y2="134"/>
<text x="418.1" y="138">24 ms</text>
<text x="32" y="158">QUIC d’OpenSSL (avant)</text>
<rect x="230" y="147" width="71.3" height="14" rx="2" fill="#868e96" fill-opacity="0.25" stroke="#868e96"/>
<line class="r" x1="290.2" y1="154" x2="431.2" y2="154"/>
<text x="437.2" y="158">17 ms</text>
<text x="32" y="178">quic-go</text>
<rect x="230" y="167" width="32.3" height="14" rx="2" fill="#7048e8" fill-opacity="0.25" stroke="#7048e8"/>
<line class="r" x1="258.3" y1="174" x2="324.7" y2="174"/>
<text x="330.7" y="178">8 ms</text>
<text class="h" x="16" y="214">25 ms dans chaque sens, 1 % perdu</text>
<text x="32" y="236">BBR</text>
<rect x="230" y="225" width="28.6" height="14" rx="2" fill="#1971c2" fill-opacity="0.25" stroke="#1971c2"/>
<line class="r" x1="257.3" y1="232" x2="261.6" y2="232"/>
<text x="267.6" y="236">0,54 s</text>
<text x="32" y="256">CUBIC</text>
<rect x="230" y="245" width="60.2" height="14" rx="2" fill="#2f9e44" fill-opacity="0.25" stroke="#2f9e44"/>
<line class="r" x1="256.4" y1="252" x2="397.5" y2="252"/>
<text x="403.5" y="256">1,13 s</text>
<text x="32" y="276">Reno</text>
<rect x="230" y="265" width="96.8" height="14" rx="2" fill="#e8590c" fill-opacity="0.25" stroke="#e8590c"/>
<line class="r" x1="261.8" y1="272" x2="410.3" y2="272"/>
<text x="416.3" y="276">1,81 s</text>
<text x="32" y="296">QUIC d’OpenSSL (avant)</text>
<rect x="230" y="285" width="225.2" height="14" rx="2" fill="#868e96" fill-opacity="0.25" stroke="#868e96"/>
<line class="r" x1="274.0" y1="292" x2="560.0" y2="292"/>
<text x="566.0" y="296">4,21 s</text>
<text x="32" y="316">quic-go</text>
<rect x="230" y="305" width="85.1" height="14" rx="2" fill="#7048e8" fill-opacity="0.25" stroke="#7048e8"/>
<line class="r" x1="250.7" y1="312" x2="379.1" y2="312"/>
<text x="385.1" y="316">1,59 s</text>
<text class="h" x="16" y="352">le même, par 20 Mbit/s</text>
<text x="32" y="374">BBR</text>
<rect x="230" y="363" width="52.3" height="14" rx="2" fill="#1971c2" fill-opacity="0.25" stroke="#1971c2"/>
<line class="r" x1="280.2" y1="370" x2="290.5" y2="370"/>
<text x="296.5" y="374">0,82 s</text>
<text x="32" y="394">CUBIC</text>
<rect x="230" y="383" width="62.1" height="14" rx="2" fill="#2f9e44" fill-opacity="0.25" stroke="#2f9e44"/>
<line class="r" x1="278.5" y1="390" x2="472.3" y2="390"/>
<text x="478.3" y="394">0,98 s</text>
<text x="32" y="414">Reno</text>
<rect x="230" y="403" width="154.8" height="14" rx="2" fill="#e8590c" fill-opacity="0.25" stroke="#e8590c"/>
<line class="r" x1="284.4" y1="410" x2="509.2" y2="410"/>
<text x="515.2" y="414">2,44 s</text>
<text x="32" y="434">QUIC d’OpenSSL (avant)</text>
<rect x="230" y="423" width="218.9" height="14" rx="2" fill="#868e96" fill-opacity="0.25" stroke="#868e96"/>
<line class="r" x1="286.0" y1="430" x2="560.0" y2="430"/>
<text x="566.0" y="434">3,45 s</text>
<text x="32" y="454">quic-go</text>
<rect x="230" y="443" width="112.4" height="14" rx="2" fill="#7048e8" fill-opacity="0.25" stroke="#7048e8"/>
<line class="r" x1="275.5" y1="450" x2="385.6" y2="450"/>
<text x="391.6" y="454">1,77 s</text>
<text class="s" x="16" y="486">Épinglé sur 2 cœurs physiques (serveur, client) ; une autre mesure peut tourner sur les 2 autres. Chaque échelle est la sienne.</text>
</svg>
