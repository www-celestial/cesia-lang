<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250">
<title>names[1..2] and names[2..end] are two new lists, their cells copied from names</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.n{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:14px;font-weight:600}
.s{fill:#57606a}
.cell{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.new{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.4}
.cp{stroke:#3a5ad9;stroke-width:1.2;fill:none;stroke-dasharray:5 3}
.ar{stroke:#1f2328;stroke-width:1.3;fill:none}
</style>
<rect width="640" height="250" fill="#fff"/>
<text class="s" x="240" y="24" text-anchor="middle">1</text>
<text class="s" x="320" y="24" text-anchor="middle">2</text>
<text class="s" x="400" y="24" text-anchor="middle">3, <tspan class="c">end</tspan></text>
<text class="n" x="112" y="54">names</text>
<line class="ar" x1="162" y1="49" x2="192" y2="49"/><polygon points="198,49 191,45 191,53"/>
<rect class="cell" x="200" y="32" width="80" height="34"/><rect class="cell" x="280" y="32" width="80" height="34"/><rect class="cell" x="360" y="32" width="80" height="34"/>
<text class="c" x="240" y="54" text-anchor="middle">"Ana"</text><text class="c" x="320" y="54" text-anchor="middle">"Bo"</text><text class="c" x="400" y="54" text-anchor="middle">"Cyril"</text>
<path class="cp" d="M240 66 L120 140"/><polygon fill="#3a5ad9" points="115,143 119,135 124,141"/>
<path class="cp" d="M312 66 L200 140"/><polygon fill="#3a5ad9" points="195,143 199,135 204,141"/>
<path class="cp" d="M328 66 L440 140"/><polygon fill="#3a5ad9" points="445,143 436,141 441,135"/>
<path class="cp" d="M400 66 L520 140"/><polygon fill="#3a5ad9" points="525,143 516,141 521,135"/>
<rect class="new" x="80" y="144" width="80" height="34"/><rect class="new" x="160" y="144" width="80" height="34"/>
<text class="c" x="120" y="166" text-anchor="middle">"Ana"</text><text class="c" x="200" y="166" text-anchor="middle">"Bo"</text>
<rect class="new" x="400" y="144" width="80" height="34"/><rect class="new" x="480" y="144" width="80" height="34"/>
<text class="c" x="440" y="166" text-anchor="middle">"Bo"</text><text class="c" x="520" y="166" text-anchor="middle">"Cyril"</text>
<text class="c" x="160" y="200" text-anchor="middle">names[1..2]</text>
<text class="s" x="160" y="218" text-anchor="middle"><tspan class="c">list.Take(2, names)</tspan></text>
<text class="c" x="480" y="200" text-anchor="middle">names[2..end]</text>
<text class="s" x="480" y="218" text-anchor="middle"><tspan class="c">list.Skip(1, names)</tspan></text>
<text class="s" x="320" y="243" text-anchor="middle">Each part is a new list, its cells copied; names keeps its three.</text>
</svg>
