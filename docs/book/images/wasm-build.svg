<svg xmlns="http://www.w3.org/2000/svg" width="895.0" height="328" viewBox="0 0 895.0 328">
<title>A terminal: cesia build --target wasm loan.ce writes loan.wasm, loan.js and loan.sites beside loan.ce; node loan.js prints the payment and three months of the loan, then No schedule for a loan of nothing; cesia run loan.ce prints the same lines.</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.p{fill:#57606a}
.s{fill:#57606a}
.e{fill:#b42318}
.a{fill:#3a5ad9}
.h{font-weight:600}
.term{fill:#f6f8fa;stroke:#8c959f;stroke-width:1}
.box{fill:#fff;stroke:#3a5ad9;stroke-width:1.4}
.mark{fill:#dbe4ff}
.l{stroke:#57606a;stroke-width:1;fill:none}
.la{stroke:#3a5ad9;stroke-width:1.4;fill:none}
</style>
<rect width="895.0" height="328" fill="#fff"/>
<rect class="term" x="1" y="1" width="542.0" height="326" rx="4"/>
<text x="16" y="26" class="c"><tspan class="p">$ </tspan>cesia build --target wasm loan.ce</text>
<line class="l" x1="548.0" y1="22" x2="564.0" y2="22"/>
<text x="570.0" y="26" class="s">compiled to WebAssembly</text>
<text x="16" y="46" class="c"><tspan class="p">$ </tspan>ls</text>
<text x="16" y="66" class="c">loan.ce  loan.js  loan.sites  loan.wasm</text>
<line class="l" x1="548.0" y1="62" x2="564.0" y2="62"/>
<text x="570.0" y="66" class="s">the module, its loader, the places of errors</text>
<text x="16" y="86" class="c"><tspan class="p">$ </tspan>node loan.js</text>
<line class="l" x1="548.0" y1="82" x2="564.0" y2="82"/>
<text x="570.0" y="86" class="s">the loader runs it in Node</text>
<text x="16" y="106" class="c">Each month: 1055.67</text>
<text x="16" y="126" class="c">Month 1: 666.67 of interest, 199610.99 still owed</text>
<text x="16" y="146" class="c">Month 2: 665.37 of interest, 199220.69 still owed</text>
<text x="16" y="166" class="c">Month 3: 664.07 of interest, 198829.08 still owed</text>
<text x="16" y="186" class="c">No schedule: a loan needs an amount and a number of years above 0</text>
<text x="16" y="206" class="c"><tspan class="p">$ </tspan>cesia run loan.ce</text>
<line class="l" x1="548.0" y1="202" x2="564.0" y2="202"/>
<text x="570.0" y="206" class="s">the same lines, byte for byte</text>
<text x="16" y="226" class="c">Each month: 1055.67</text>
<text x="16" y="246" class="c">Month 1: 666.67 of interest, 199610.99 still owed</text>
<text x="16" y="266" class="c">Month 2: 665.37 of interest, 199220.69 still owed</text>
<text x="16" y="286" class="c">Month 3: 664.07 of interest, 198829.08 still owed</text>
<text x="16" y="306" class="c">No schedule: a loan needs an amount and a number of years above 0</text>
</svg>
