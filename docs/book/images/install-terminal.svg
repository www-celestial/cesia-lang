<svg xmlns="http://www.w3.org/2000/svg" width="480" height="164" viewBox="0 0 480 164">
<title>A terminal: cesia version prints cesia 1.3.0+dev, and cesia run hello.ce prints Hello, world!</title>
<style>
text{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:14px;fill:#1f2328}
.p{fill:#57606a}
.bar{font-family:system-ui, sans-serif;font-size:13px;fill:#57606a}
</style>
<rect width="480" height="164" fill="#fff"/>
<rect x="1" y="1" width="478" height="162" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
<path d="M1 30 L479 30" stroke="#d0d7de" stroke-width="1"/>
<circle cx="18" cy="16" r="5" fill="#d0d7de"/><circle cx="34" cy="16" r="5" fill="#d0d7de"/><circle cx="50" cy="16" r="5" fill="#d0d7de"/>
<text class="bar" x="240" y="20" text-anchor="middle">terminal</text>
<text x="18" y="60"><tspan class="p">$ </tspan>cesia version</text>
<text x="18" y="84">cesia 1.3.0+dev</text>
<text x="18" y="116"><tspan class="p">$ </tspan>cesia run hello.ce</text>
<text x="18" y="140">Hello, world!</text>
</svg>
