<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560">
<title>The path of a program in Cesia: lexer, parser and resolver per file; inference and compiler per function; the JIT and MIR for hot code</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.h{font-weight:600}
.g{font-weight:600;fill:#3a5ad9}
.s{fill:#57606a}
.st{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.jt{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.4}
.tk{fill:#f6f8fa;stroke:#8c959f;stroke-width:1}
</style>
<rect width="640" height="560" fill="#fff"/>
<text class="g" x="14" y="20">Per file, when the program first needs it</text>
<text class="s" x="626" y="20" text-anchor="end">for <tspan class="c">total = price * (1 + tax)</tspan></text>
<rect class="st" x="40" y="30" width="176" height="40" rx="5"/><text class="h" x="52" y="47">the lexer</text><text class="c s" x="52" y="63">lexer.ml</text>
<rect class="tk" x="244" y="38" width="49" height="22" rx="3"/><text class="c" x="268" y="54" text-anchor="middle">total</text>
<rect class="tk" x="298" y="38" width="18" height="22" rx="3"/><text class="c" x="307" y="54" text-anchor="middle">=</text>
<rect class="tk" x="321" y="38" width="49" height="22" rx="3"/><text class="c" x="345" y="54" text-anchor="middle">price</text>
<rect class="tk" x="375" y="38" width="18" height="22" rx="3"/><text class="c" x="384" y="54" text-anchor="middle">*</text>
<rect class="tk" x="398" y="38" width="18" height="22" rx="3"/><text class="c" x="406" y="54" text-anchor="middle">(</text>
<rect class="tk" x="420" y="38" width="18" height="22" rx="3"/><text class="c" x="429" y="54" text-anchor="middle">1</text>
<rect class="tk" x="443" y="38" width="18" height="22" rx="3"/><text class="c" x="452" y="54" text-anchor="middle">+</text>
<rect class="tk" x="466" y="38" width="33" height="22" rx="3"/><text class="c" x="483" y="54" text-anchor="middle">tax</text>
<rect class="tk" x="504" y="38" width="18" height="22" rx="3"/><text class="c" x="513" y="54" text-anchor="middle">)</text>
<text class="s" x="531" y="54">tokens</text>
<line x1="128" y1="70" x2="128.0" y2="83.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="128,90 124.0,82.0 132.0,82.0"/>
<rect class="st" x="40" y="90" width="176" height="40" rx="5"/><text class="h" x="52" y="107">the parser</text><text class="c s" x="52" y="123">parser.ml</text>
<text class="c" x="244" y="84">Assign total</text>
<text class="c" x="244" y="100">└── Bin *</text>
<text class="c" x="275" y="116">├── Name price</text>
<text class="c" x="275" y="132">└── Bin +</text>
<text class="c" x="306" y="148">├── Int 1</text>
<text class="c" x="306" y="164">└── Name tax</text>
<text class="s" x="440" y="116">the syntax tree: one</text><text class="s" x="440" y="132">node per expression</text>
<line x1="128" y1="130" x2="128.0" y2="165.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="128,172 124.0,164.0 132.0,164.0"/>
<rect class="st" x="40" y="172" width="176" height="40" rx="5"/><text class="h" x="52" y="189">the resolver</text><text class="c s" x="52" y="205">resolve.ml</text>
<text x="244" y="188">ties each name to its place: a variable of the</text>
<text x="244" y="205">function, a captured one, a name of the file or of a package</text>
<text class="s" x="244" y="230"><tspan class="c">cesia check</tspan> runs these three, then its own</text>
<text class="s" x="244" y="246">checks, and never runs the program</text>
<line x1="128" y1="212" x2="128.0" y2="273.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="128,280 124.0,272.0 132.0,272.0"/>
<text class="g" x="140" y="268">Per function, at its first call</text>
<rect class="st" x="40" y="280" width="176" height="40" rx="5"/><text class="h" x="52" y="297">inference</text><text class="c s" x="52" y="313">infer.ml</text>
<text x="244" y="296">a type for each variable and node, in a version per</text>
<text x="244" y="313">types of the arguments: <tspan class="c">area(2, 3)</tspan>, <tspan class="c">area(2.0, 3.0)</tspan></text>
<line x1="128" y1="320" x2="128.0" y2="329.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="128,336 124.0,328.0 132.0,328.0"/>
<rect class="st" x="40" y="336" width="176" height="40" rx="5"/><text class="h" x="52" y="353">the compiler</text><text class="c s" x="52" y="369">compile.ml</text>
<text x="244" y="352">OCaml closures, one per node: the interpreter</text>
<text x="244" y="369">runs them, numbers unboxed where typed</text>
<line x1="128" y1="376" x2="128.0" y2="425.0" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="128,432 124.0,424.0 132.0,424.0"/>
<text class="g" x="140" y="400">When it gets hot</text>
<text class="s" x="140" y="418">1,000 calls of a version that gives a number, or a loop at its second checkpoint</text>
<rect class="jt" x="40" y="432" width="176" height="40" rx="5"/><text class="h" x="52" y="449">the JIT</text><text class="c s" x="52" y="465">src/jit/</text>
<text x="244" y="448">a plugin, loaded at the first hot unit: its IR,</text>
<text x="244" y="465">typed blocks, written as text for MIR</text>
<line x1="128" y1="472" x2="128.0" y2="481.0" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="128,488 124.0,480.0 132.0,480.0"/>
<rect class="jt" x="40" y="488" width="176" height="40" rx="5"/><text class="h" x="52" y="505">MIR</text><text class="c s" x="52" y="521">src/sys/mir/</text>
<text x="244" y="504">machine code: level 1 at once, level 2</text>
<text x="244" y="521">later, made on another core</text>
<path d="M40 508 L24 508 L24 356 L33 356" fill="none" stroke="#cf222e" stroke-width="1.3"/><polygon fill="#cf222e" points="40,356 32,352 32,360"/>
<text x="14" y="550"><tspan fill="#cf222e">red</tspan><tspan class="s">: a failed guard bails, back to the interpreter before its statement, the same answer a little later</tspan></text>
</svg>
