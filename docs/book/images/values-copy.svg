<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232">
<title>Two names, one list until a write: b[1] = 100 copies the list for b, and a keeps [1, 2, 3]</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.h{font-size:14px;font-weight:600}
.n{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:15px;font-weight:600}
.s{fill:#57606a}
.cell{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.new{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.ar{stroke:#1f2328;stroke-width:1.3;fill:none}
.sep{stroke:#d0d7de;stroke-width:1}
</style>
<rect width="640" height="232" fill="#fff"/>
<line class="sep" x1="213" y1="12" x2="213" y2="220"/>
<line class="sep" x1="426" y1="12" x2="426" y2="220"/>
<text class="c h" x="14" y="30">a = [1, 2, 3]</text>
<text class="c h" x="227" y="30">b = a</text>
<text class="c h" x="440" y="30">b[1] = 100</text>
<text class="n" x="16" y="100">a</text>
<line class="ar" x1="30" y1="95" x2="62" y2="95"/><polygon points="68,95 61,91 61,99"/>
<rect class="cell" x="70" y="80" width="40" height="30"/><rect class="cell" x="110" y="80" width="40" height="30"/><rect class="cell" x="150" y="80" width="40" height="30"/>
<text class="c" x="90" y="100" text-anchor="middle">1</text><text class="c" x="130" y="100" text-anchor="middle">2</text><text class="c" x="170" y="100" text-anchor="middle">3</text>
<text class="n" x="229" y="85">a</text>
<text class="n" x="229" y="150">b</text>
<path class="ar" d="M243 80 C258 80 262 112 276 112"/><polygon points="283,113 275,108 275,117"/>
<path class="ar" d="M243 145 C258 145 262 118 276 118"/><polygon points="283,117 275,113 275,122"/>
<rect class="cell" x="285" y="100" width="40" height="30"/><rect class="cell" x="325" y="100" width="40" height="30"/><rect class="cell" x="365" y="100" width="40" height="30"/>
<text class="c" x="305" y="120" text-anchor="middle">1</text><text class="c" x="345" y="120" text-anchor="middle">2</text><text class="c" x="385" y="120" text-anchor="middle">3</text>
<text class="n" x="442" y="85">a</text>
<line class="ar" x1="456" y1="80" x2="490" y2="80"/><polygon points="496,80 489,76 489,84"/>
<rect class="cell" x="498" y="65" width="40" height="30"/><rect class="cell" x="538" y="65" width="40" height="30"/><rect class="cell" x="578" y="65" width="40" height="30"/>
<text class="c" x="518" y="85" text-anchor="middle">1</text><text class="c" x="558" y="85" text-anchor="middle">2</text><text class="c" x="598" y="85" text-anchor="middle">3</text>
<text class="n" x="442" y="150">b</text>
<line class="ar" x1="456" y1="145" x2="490" y2="145"/><polygon points="496,145 489,141 489,149"/>
<rect class="new" x="498" y="130" width="40" height="30"/><rect class="cell" x="538" y="130" width="40" height="30"/><rect class="cell" x="578" y="130" width="40" height="30"/>
<text class="c" x="518" y="150" text-anchor="middle" fill="#3a5ad9">100</text><text class="c" x="558" y="150" text-anchor="middle">2</text><text class="c" x="598" y="150" text-anchor="middle">3</text>
<text class="s" x="14" y="186">a holds a list.</text>
<text class="s" x="227" y="186">One list, two names:</text>
<text class="s" x="227" y="204">nothing is copied yet.</text>
<text class="s" x="440" y="186">The write copies the list</text>
<text class="s" x="440" y="204">for b first; a keeps its own.</text>
</svg>
