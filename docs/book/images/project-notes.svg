<svg xmlns="http://www.w3.org/2000/svg" width="640" height="336" viewBox="0 0 640 336">
<title>The project notes: main.ce uses the package src/notes, and the task serve may read and write data/ and listen on port 8080</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.s{fill:#57606a}
.pk{fill:#3a5ad9;font-weight:600}
.dt{fill:#1a7f37;font-weight:600}
.br{stroke:#57606a;stroke-width:1.2;fill:none}
</style>
<rect width="640" height="336" fill="#fff"/>
<text class="c" x="14" y="34">notes/</text>
<text class="c" x="32" y="68">cesia.toml</text>
<text class="c dt" x="32" y="102">data/</text>
<text class="c" x="32" y="136">src/</text>
<text class="c" x="50" y="170">main.ce</text>
<text class="c pk" x="50" y="204">notes/</text>
<text class="c" x="68" y="238">store.ce</text>
<text class="c" x="68" y="272">routes.ce</text>
<text class="c" x="68" y="306">routes.test.ce</text>
<line x1="118" y1="64" x2="254" y2="64" stroke="#8c959f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="262" y="60">task <tspan class="c">serve</tspan>: runs <tspan class="c">src/main.ce</tspan>, and allows</text>
<text class="c" x="262" y="77">read=data, write=data, net=:8080</text>
<line x1="254" y1="98" x2="86.0" y2="98.0" stroke="#1a7f37" stroke-width="1.3"/><polygon fill="#1a7f37" points="79.0,98 87.0,94.0 87.0,102.0"/>
<text x="262" y="102">the database, made at the first run: the only</text>
<text x="262" y="118">folder the server may read and write</text>
<text x="262" y="170"><tspan class="c">use src/notes</tspan>, then serves <tspan class="c">notes.App(db)</tspan></text>
<text x="262" y="186">on port 8080</text>
<line x1="254" y1="166" x2="112.6" y2="166" stroke="#8c959f" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="254" y1="200" x2="111.8" y2="200.0" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="104.8,200 112.8,196.0 112.8,204.0"/>
<text x="262" y="204">the package the use names: <tspan class="c">notes.Open</tspan>,</text>
<text x="262" y="220"><tspan class="c">notes.App</tspan> and the other public names</text>
<path class="br" d="M187.2 225 L193.2 225 L193.2 310 L187.2 310 M193.2 267 L199.2 267"/>
<line x1="205" y1="266" x2="254" y2="266" stroke="#8c959f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="262" y="270">one package: its files see each other's names</text>
<text x="262" y="306">its tests: they see its private names, and are</text>
<text x="262" y="322">no part of the program: <tspan class="c">cesia test</tspan> runs them</text>
</svg>
