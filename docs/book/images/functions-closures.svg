<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
<title>Closures: adder(10) and adder(100) share one code and each keep their n; show keeps count as 1 after count = 2</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.n{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px;font-weight:600}
.s{fill:#57606a}
.cell{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.cap{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.5}
.code{fill:#f6f8fa;stroke:#1f2328;stroke-width:1.2}
.sep{stroke:#d0d7de;stroke-width:1}
</style>
<rect width="640" height="300" fill="#fff"/>
<line class="sep" x1="338" y1="10" x2="338" y2="290"/>
<text class="c" x="14" y="24">adder(n) = x -&gt; x + n</text>
<text class="n" x="14" y="76">addTen</text><line x1="106" y1="71" x2="131.0" y2="71.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="138,71 130.0,75.0 130.0,67.0"/><rect class="cell" x="140" y="56" width="62" height="30"/><text class="s" x="148" y="76">code</text><circle cx="190" cy="71" r="3.5" fill="#1f2328"/><rect class="cap" x="202" y="56" width="92" height="30"/><text class="c" x="248" y="76" text-anchor="middle" fill="#3a5ad9">n = 10</text>
<text class="n" x="14" y="132">adder(100)</text><line x1="106" y1="127" x2="131.0" y2="127.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="138,127 130.0,131.0 130.0,123.0"/><rect class="cell" x="140" y="112" width="62" height="30"/><text class="s" x="148" y="132">code</text><circle cx="190" cy="127" r="3.5" fill="#1f2328"/><rect class="cap" x="202" y="112" width="92" height="30"/><text class="c" x="248" y="132" text-anchor="middle" fill="#3a5ad9">n = 100</text>
<rect class="code" x="96" y="188" width="150" height="32" rx="4"/><text class="c" x="171" y="209" text-anchor="middle">x -&gt; x + n</text>
<text class="s" x="171" y="238" text-anchor="middle">one code for both</text>
<path d="M190 71 L190 98 L314 98 L314 204 L254 204" fill="none" stroke="#1f2328" stroke-width="1.2"/><polygon fill="#1f2328" points="247,204 255,200 255,208"/>
<line x1="190" y1="127" x2="190" y2="179" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="190,186 186,178 194,178"/>
<text class="c" x="14" y="268">addTen(5) --&gt; 15</text>
<text class="c" x="14" y="287">adder(100)(1) --&gt; 101</text>
<text class="c" x="354" y="24">count = 1</text><text class="c" x="354" y="42">show = () -&gt; count</text><text class="c" x="354" y="60">count = 2</text>
<text class="n" x="354" y="104">count</text>
<line x1="400" y1="99" x2="429.0" y2="99.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="436,99 428.0,103.0 428.0,95.0"/>
<rect class="cell" x="438" y="84" width="44" height="30"/><text class="c" x="460" y="104" text-anchor="middle">2</text>
<text class="n" x="354" y="160">show</text><line x1="404" y1="155" x2="429.0" y2="155.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="436,155 428.0,159.0 428.0,151.0"/><rect class="cell" x="438" y="140" width="62" height="30"/><text class="s" x="446" y="160">code</text><circle cx="488" cy="155" r="3.5" fill="#1f2328"/><rect class="cap" x="500" y="140" width="92" height="30"/><text class="c" x="546" y="160" text-anchor="middle" fill="#3a5ad9">count = 1</text>
<rect class="code" x="414" y="200" width="140" height="32" rx="4"/><text class="c" x="484" y="221" text-anchor="middle">() -&gt; count</text>
<line x1="488" y1="155" x2="488.0" y2="191.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="488,198 484.0,190.0 492.0,190.0"/>
<text class="c" x="354" y="268">show() --&gt; 1</text>
<text class="s" x="354" y="287">it kept the value count had then</text>
</svg>
