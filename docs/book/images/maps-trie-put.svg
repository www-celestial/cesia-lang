<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
<title>dict.Put on a trie: the new map copies the three nodes on its key's path and shares the rest with the old map</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.h{font-weight:600}
.s{fill:#57606a}
.old{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.new{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.sh{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.1}
</style>
<rect width="640" height="440" fill="#fff"/>
<text x="14" y="22">A map <tspan class="c">m</tspan> of 100,000 keys, then <tspan class="c">dict.Put("City", "Lyon", m)</tspan>:</text>
<text class="h" x="134" y="50" text-anchor="middle">m, as it was</text>
<text class="h" x="506" y="50" text-anchor="middle" fill="#3a5ad9">the new map</text>
<rect class="old" x="24" y="62" width="220" height="32" rx="4"/><text x="134.0" y="83" text-anchor="middle">root: 32 places, by bits 1-5</text>
<rect class="new" x="396" y="62" width="220" height="32" rx="4"/><text x="506.0" y="83" text-anchor="middle" fill="#3a5ad9">its root, copied</text>
<rect class="sh" x="262" y="114" width="116" height="30" rx="4"/><text x="320.0" y="134" text-anchor="middle">31 other places</text>
<rect class="old" x="24" y="166" width="220" height="32" rx="4"/><text x="134.0" y="187" text-anchor="middle">17: 32 places, by bits 6-10</text>
<rect class="new" x="396" y="166" width="220" height="32" rx="4"/><text x="506.0" y="187" text-anchor="middle" fill="#3a5ad9">17, copied</text>
<rect class="sh" x="262" y="218" width="116" height="30" rx="4"/><text x="320.0" y="238" text-anchor="middle">31 other places</text>
<rect class="old" x="24" y="270" width="220" height="62" rx="4"/><text x="134.0" y="289" text-anchor="middle">4: about 98 keys under it,</text><text x="134.0" y="306" text-anchor="middle">by bits 11-15; inline:</text><text x="134.0" y="323" text-anchor="middle"><tspan class="c">"apple" -&gt; 3, "pear" -&gt; 9</tspan></text>
<rect class="new" x="396" y="270" width="220" height="62" rx="4"/><text x="506.0" y="289" text-anchor="middle" fill="#3a5ad9">4, copied, with a new</text><text x="506.0" y="306" text-anchor="middle" fill="#3a5ad9">key inline:</text><text x="506.0" y="323" text-anchor="middle" fill="#3a5ad9"><tspan class="c">"City" -&gt; "Lyon"</tspan></text>
<rect class="sh" x="262" y="350" width="116" height="48" rx="4"/><text x="320.0" y="370" text-anchor="middle">12: a node of</text><text x="320.0" y="388" text-anchor="middle">the 3 keys there</text>
<line x1="134" y1="94" x2="134.0" y2="159.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="134,166 130.0,158.0 138.0,158.0"/>
<text class="s" x="140" y="135">place 17</text>
<line x1="224" y1="94" x2="269.5" y2="111.5" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="276,114 267.1,114.9 270.0,107.4"/>
<line x1="134" y1="198" x2="134.0" y2="263.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="134,270 130.0,262.0 138.0,262.0"/>
<text class="s" x="140" y="239">place 4</text>
<line x1="224" y1="198" x2="269.5" y2="215.5" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="276,218 267.1,218.9 270.0,211.4"/>
<line x1="224" y1="332" x2="267.7" y2="353.0" stroke="#1f2328" stroke-width="1.3"/><polygon fill="#1f2328" points="274,356 265.1,356.1 268.5,348.9"/>
<text class="s" x="154" y="358">place 12</text>
<line x1="506" y1="94" x2="506.0" y2="159.0" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="506,166 502.0,158.0 510.0,158.0"/>
<text class="s" x="512" y="135">place 17</text>
<line x1="416" y1="94" x2="370.5" y2="111.5" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="364,114 370.0,107.4 372.9,114.9"/>
<line x1="506" y1="198" x2="506.0" y2="263.0" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="506,270 502.0,262.0 510.0,262.0"/>
<text class="s" x="512" y="239">place 4</text>
<line x1="416" y1="198" x2="370.5" y2="215.5" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="364,218 370.0,211.4 372.9,218.9"/>
<line x1="416" y1="332" x2="372.3" y2="353.0" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="366,356 371.5,348.9 374.9,356.1"/>
<text class="s" x="426" y="358">place 12</text>
<text x="14" y="418">The new map copies the 3 nodes on the path of its key and shares the rest; <tspan class="c">m</tspan> is unchanged.</text>
<text class="s" x="14" y="435">An example: where a key falls depends on its hash, which takes a seed drawn at each run.</text>
</svg>
