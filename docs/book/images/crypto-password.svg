<svg xmlns="http://www.w3.org/2000/svg" width="797.0" height="240" viewBox="0 0 797.0 240">
<title>What crypto.HashPassword keeps for correct horse, part by part: argon2id, the algorithm; v=19, its version; the memory, passes and lanes it took; the salt, random bytes; the hash. The same password hashed again gives another salt and another hash, and crypto.CheckPassword reads all it needs in the text.</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.p{fill:#57606a}
.s{fill:#57606a}
.e{fill:#b42318}
.a{fill:#3a5ad9}
.h{font-weight:600}
.term{fill:#f6f8fa;stroke:#8c959f;stroke-width:1}
.box{fill:#fff;stroke:#3a5ad9;stroke-width:1.4}
.mark{fill:#dbe4ff}
.l{stroke:#57606a;stroke-width:1;fill:none}
.la{stroke:#3a5ad9;stroke-width:1.4;fill:none}
</style>
<rect width="797.0" height="240" fill="#fff"/>
<text x="16" y="22" class="h">crypto.HashPassword(&quot;correct horse&quot;, s)</text>
<rect class="term" x="15" y="36" width="73.0" height="22" rx="4"/>
<text x="16" y="52" class="c">$argon2id</text>
<line class="l" x1="51.324999999999996" y1="60" x2="51.324999999999996" y2="68"/>
<text x="57.324999999999996" y="74" class="s">the algorithm: Argon2id</text>
<rect class="term" x="85.64999999999999" y="36" width="41.0" height="22" rx="4"/>
<text x="86.64999999999999" y="52" class="c">$v=19</text>
<line class="l" x1="106.27499999999999" y1="60" x2="106.27499999999999" y2="86"/>
<text x="112.27499999999999" y="92" class="s">its version</text>
<rect class="term" x="124.89999999999999" y="36" width="128.0" height="22" rx="4"/>
<text x="125.89999999999999" y="52" class="c">$m=65536,t=2,p=1</text>
<line class="l" x1="188.7" y1="60" x2="188.7" y2="104"/>
<text x="194.7" y="110" class="s">memory 64 MiB, 2 passes, 1 lane</text>
<rect class="box" x="250.5" y="36" width="183.0" height="22" rx="4"/>
<text x="251.5" y="52" class="c">$ScrBsbYZHe1yRrQbfS8CPQ</text>
<line class="l" x1="341.775" y1="60" x2="341.775" y2="122"/>
<text x="347.775" y="128" class="a">the salt: random, 16 bytes</text>
<rect class="box" x="431.04999999999995" y="36" width="347.0" height="22" rx="4"/>
<text x="432.04999999999995" y="52" class="c">$k32934aWycnRlkpTZu9IHbP9OROqX3e2bulLh4q9Cnc</text>
<line class="l" x1="604.75" y1="60" x2="604.75" y2="140"/>
<text x="610.75" y="146" class="a">the hash: 32 bytes</text>
<text x="16" y="180" class="h">The same password again: another salt, another hash</text>
<text x="16" y="204" class="c">$argon2id$v=19$m=65536,t=2,p=1$My0la9EXaAFJUGrLqrkWag$H6GNB+H/db7Z2yNciXIdt0RJgJLr3RLkXbxaGkde9ZA</text>
<text x="16" y="228" class="s">crypto.CheckPassword(&quot;correct horse&quot;, stored, s) reads the salt and the settings in the text: true for both.</text>
</svg>
