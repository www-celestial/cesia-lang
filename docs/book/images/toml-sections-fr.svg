<svg xmlns="http://www.w3.org/2000/svg" width="820" height="418" viewBox="0 0 820 418">
<title>Un cesia.toml, chacune de ses tables à côté de la commande qui la lit : la table project pour toutes les commandes, deps.ceres pour cesia pkg et use deps/www-celestial/ceres, tasks.serve pour cesia do serve, test pour cesia test, site pour cesia doc --site.</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.p{fill:#57606a}
.s{fill:#57606a}
.e{fill:#b42318}
.a{fill:#3a5ad9}
.h{font-weight:600}
.term{fill:#f6f8fa;stroke:#8c959f;stroke-width:1}
.box{fill:#fff;stroke:#3a5ad9;stroke-width:1.4}
.mark{fill:#dbe4ff}
.l{stroke:#57606a;stroke-width:1;fill:none}
.la{stroke:#3a5ad9;stroke-width:1.4;fill:none}
</style>
<rect width="820" height="418" fill="#fff"/>
<text x="16" y="22" class="h">cesia.toml</text>
<text x="490" y="22" class="h">qui la lit</text>
<rect class="term" x="16" y="34" width="450" height="66" rx="4"/>
<text x="28" y="54" class="c a">[project]</text>
<text x="28" y="72" class="c">name = &quot;shop&quot;</text>
<text x="28" y="90" class="c">cesia = &quot;1.3&quot;</text>
<line class="la" x1="470" y1="67" x2="483" y2="67"/><polygon fill="#3a5ad9" points="490,67 482,63 482,71"/>
<text x="498" y="62" class="c">toutes les commandes</text>
<text x="498" y="80" class="s">le nom du projet et sa version de Cesia</text>
<rect class="term" x="16" y="110" width="450" height="66" rx="4"/>
<text x="28" y="130" class="c a">[deps.ceres]</text>
<text x="28" y="148" class="c">from = &quot;github.com/www-celestial/ceres&quot;</text>
<text x="28" y="166" class="c">version = &quot;v0.1.0&quot;</text>
<line class="la" x1="470" y1="143" x2="483" y2="143"/><polygon fill="#3a5ad9" points="490,143 482,139 482,147"/>
<text x="498" y="138" class="c">cesia pkg</text>
<text x="498" y="156" class="s">le télécharge ; use deps/www-celestial/ceres/...</text>
<rect class="term" x="16" y="186" width="450" height="66" rx="4"/>
<text x="28" y="206" class="c a">[tasks.serve]</text>
<text x="28" y="224" class="c">file = &quot;src/serve.ce&quot;</text>
<text x="28" y="242" class="c">allow = [&quot;net=:8080&quot;, &quot;read=public&quot;]</text>
<line class="la" x1="470" y1="219" x2="483" y2="219"/><polygon fill="#3a5ad9" points="490,219 482,215 482,223"/>
<text x="498" y="214" class="c">cesia do serve</text>
<text x="498" y="232" class="s">lance le fichier avec ces permissions</text>
<rect class="term" x="16" y="262" width="450" height="66" rx="4"/>
<text x="28" y="282" class="c a">[test]</text>
<text x="28" y="300" class="c">allow = [&quot;read=files&quot;]</text>
<text x="28" y="318" class="c">timeout = &quot;30&quot;</text>
<line class="la" x1="470" y1="295" x2="483" y2="295"/><polygon fill="#3a5ad9" points="490,295 482,291 482,299"/>
<text x="498" y="290" class="c">cesia test</text>
<text x="498" y="308" class="s">les permissions et la durée des tests</text>
<rect class="term" x="16" y="338" width="450" height="66" rx="4"/>
<text x="28" y="358" class="c a">[site]</text>
<text x="28" y="376" class="c">title = &quot;Shop&quot;</text>
<text x="28" y="394" class="c">source = &quot;https://github.com/someone/shop/blob/main/&quot;</text>
<line class="la" x1="470" y1="371" x2="483" y2="371"/><polygon fill="#3a5ad9" points="490,371 482,367 482,375"/>
<text x="498" y="366" class="c">cesia doc --site</text>
<text x="498" y="384" class="s">le site du livre et la référence</text>
</svg>
