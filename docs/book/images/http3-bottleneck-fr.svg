<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354">
<title>Un téléchargement de 1 Mo, 25 ms dans chaque sens, 1 % perdu, 20 Mbit/s au plus</title>
<style>text{font-family:system-ui, sans-serif;font-size:12px;fill:#1f2328}.h{font-weight:600;font-size:13px}.s{fill:#57606a}.b{fill:#e7f5ff;stroke:#1971c2}.c{fill:#fff4e6;stroke:#e8590c}.r{stroke:#57606a;stroke-width:1.2}</style>
<rect width="760" height="354" fill="#fff"/>
<text class="h" x="16" y="24">Un téléchargement de 1 Mo, 25 ms dans chaque sens, 1 % perdu, 20 Mbit/s au plus</text>
<text class="s" x="16" y="42">une nouvelle connexion à chaque fois, le client est quic-go ; médiane des tours, la ligne du plus court au plus long</text>
<text x="16" y="78">Cesia, HTTP/3 sur ngtcp2, BBR (par défaut)</text>
<rect class="c" x="330" y="66" width="39.6" height="16" rx="2"/>
<line class="r" x1="368.0" y1="74" x2="375.8" y2="74"/>
<text x="381.8" y="78">0,82 s [0,79 ; 0,95], n = 21</text>
<text x="16" y="106">Cesia, HTTP/3 sur ngtcp2, CUBIC</text>
<rect class="c" x="330" y="94" width="47.0" height="16" rx="2"/>
<line class="r" x1="366.7" y1="102" x2="513.5" y2="102"/>
<text x="519.5" y="106">0,98 s [0,76 ; 3,82], n = 21</text>
<text x="16" y="134">Cesia, HTTP/3 sur ngtcp2, Reno</text>
<rect class="c" x="330" y="122" width="117.3" height="16" rx="2"/>
<line class="r" x1="371.2" y1="130" x2="541.5" y2="130"/>
<text x="547.5" y="134">2,44 s [0,86 ; 4,40], n = 21</text>
<text x="16" y="162">Cesia avant, HTTP/3 sur le QUIC d’OpenSSL</text>
<rect class="c" x="330" y="150" width="165.8" height="16" rx="2"/>
<line class="r" x1="372.4" y1="158" x2="580.0" y2="158"/>
<text x="586.0" y="162">3,45 s [0,88 ; 5,20], n = 21</text>
<text x="16" y="190">ngtcp2 1.26, CUBIC</text>
<rect class="b" x="330" y="178" width="46.1" height="16" rx="2"/>
<line class="r" x1="364.5" y1="186" x2="474.6" y2="186"/>
<text x="480.6" y="190">0,96 s [0,72 ; 3,01], n = 21</text>
<text x="16" y="218">ngtcp2 1.26, BBR</text>
<rect class="b" x="330" y="206" width="37.9" height="16" rx="2"/>
<line class="r" x1="364.7" y1="214" x2="376.0" y2="214"/>
<text x="382.0" y="218">0,79 s [0,72 ; 0,96], n = 21</text>
<text x="16" y="246">quic-go 0.66, HTTP/3</text>
<rect class="b" x="330" y="234" width="85.2" height="16" rx="2"/>
<line class="r" x1="364.5" y1="242" x2="447.8" y2="242"/>
<text x="453.8" y="246">1,77 s [0,72 ; 2,45], n = 21</text>
<text x="16" y="274">Cesia, HTTP/1.1 sur TCP (CUBIC de Linux)</text>
<rect class="b" x="330" y="262" width="88.4" height="16" rx="2"/>
<line class="r" x1="375.2" y1="270" x2="557.1" y2="270"/>
<text x="563.1" y="274">1,84 s [0,94 ; 4,73], n = 21</text>
<text class="s" x="16" y="308">Un goulot de 20 Mbit/s espace les paquets, comme un vrai chemin. Épinglé sur 2 cœurs physiques, une autre</text>
<text class="s" x="16" y="324">mesure peut tourner sur les 2 autres.</text>
</svg>
