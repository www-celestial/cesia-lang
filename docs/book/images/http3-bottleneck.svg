<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326">
<title>A download of 1 MB, 25 ms each way, 1 % lost, 20 Mbit/s at most</title>
<style>text{font-family:system-ui, sans-serif;font-size:12px;fill:#1f2328}.h{font-weight:600;font-size:13px}.s{fill:#57606a}.b{fill:#e7f5ff;stroke:#1971c2}.c{fill:#fff4e6;stroke:#e8590c}.r{stroke:#57606a;stroke-width:1.2}</style>
<rect width="760" height="326" fill="#fff"/>
<text class="h" x="16" y="24">A download of 1 MB, 25 ms each way, 1 % lost, 20 Mbit/s at most</text>
<text class="s" x="16" y="42">a new connection each time, the client is quic-go's; median of the rounds, the line from the least to the most</text>
<text x="16" y="78">Cesia, HTTP/3 (OpenSSL 4.1's QUIC)</text>
<rect class="c" x="330" y="66" width="100.8" height="16" rx="2"/>
<line class="r" x1="374.3" y1="74" x2="580.0" y2="74"/>
<text x="586.0" y="78">1.95 s [0.86, 4.83], n = 21</text>
<text x="16" y="106">OpenSSL 4.1's QUIC alone, its own loop</text>
<rect class="c" x="330" y="94" width="162.2" height="16" rx="2"/>
<line class="r" x1="380.0" y1="102" x2="561.4" y2="102"/>
<text x="567.4" y="106">3.14 s [0.97, 4.47], n = 21</text>
<text x="16" y="134">ngtcp2 1.26, Reno</text>
<rect class="b" x="330" y="122" width="133.3" height="16" rx="2"/>
<line class="r" x1="368.7" y1="130" x2="574.2" y2="130"/>
<text x="580.2" y="134">2.58 s [0.75, 4.72], n = 21</text>
<text x="16" y="162">ngtcp2 1.26, CUBIC</text>
<rect class="b" x="330" y="150" width="68.0" height="16" rx="2"/>
<line class="r" x1="366.0" y1="158" x2="529.6" y2="158"/>
<text x="535.6" y="162">1.31 s [0.70, 3.86], n = 21</text>
<text x="16" y="190">ngtcp2 1.26, BBR</text>
<rect class="b" x="330" y="178" width="40.2" height="16" rx="2"/>
<line class="r" x1="368.4" y1="186" x2="376.5" y2="186"/>
<text x="382.5" y="190">0.78 s [0.74, 0.90], n = 21</text>
<text x="16" y="218">quic-go 0.66, HTTP/3</text>
<rect class="b" x="330" y="206" width="70.2" height="16" rx="2"/>
<line class="r" x1="362.0" y1="214" x2="464.3" y2="214"/>
<text x="470.3" y="218">1.36 s [0.62, 2.60], n = 21</text>
<text x="16" y="246">Cesia, HTTP/1.1 over TCP (Linux CUBIC)</text>
<rect class="b" x="330" y="234" width="59.5" height="16" rx="2"/>
<line class="r" x1="375.3" y1="242" x2="499.5" y2="242"/>
<text x="505.5" y="246">1.15 s [0.88, 3.28], n = 21</text>
<text class="s" x="16" y="280">A bottleneck of 20 Mbit/s spaces the packets, as a real path does: OpenSSL's NewReno no longer differs</text>
<text class="s" x="16" y="296">from ngtcp2's (p = 0.21); CUBIC and BBR stay ahead.</text>
</svg>
