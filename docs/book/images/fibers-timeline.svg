<svg xmlns="http://www.w3.org/2000/svg" width="640" height="318" viewBox="0 0 640 318">
<title>A timeline of the main program and the fibers bread and cake: both sleep at once, cake wakes at 0.1 s, bread at 0.2 s, and the whole takes 0.2 s</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px}
.s{fill:#57606a}
.h{font-weight:600}
.run{fill:#3a5ad9}
.wait{stroke:#57606a;stroke-width:1.6;stroke-dasharray:5 4}
.grid{stroke:#d0d7de;stroke-width:1;stroke-dasharray:2 3}
.ax{stroke:#1f2328;stroke-width:1.2}
</style>
<rect width="640" height="318" fill="#fff"/>
<line class="grid" x1="360" y1="36" x2="360" y2="244"/>
<line class="grid" x1="570" y1="36" x2="570" y2="244"/>
<text class="h" x="14" y="71">main program</text>
<text class="h" x="14" y="145">fiber <tspan class="c">bread</tspan></text>
<text class="h" x="14" y="219">fiber <tspan class="c">cake</tspan></text>
<rect class="run" x="150" y="59" width="16" height="14" rx="2"/>
<line class="wait" x1="166" y1="66" x2="586" y2="66"/>
<rect class="run" x="586" y="59" width="16" height="14" rx="2"/>
<text x="150" y="52"><tspan class="c">Spawn</tspan>, <tspan class="c">Spawn</tspan>, <tspan class="c">Wait(bread)</tspan></text>
<text class="s" x="465" y="58" text-anchor="middle">waits for bread</text>
<text x="574" y="92" text-anchor="end"><tspan class="c">Ok("bread is ready")</tspan>, then <tspan class="c">Ok("cake is ready")</tspan> at once</text>
<rect class="run" x="166" y="133" width="16" height="14" rx="2"/>
<line class="wait" x1="182" y1="140" x2="570" y2="140"/>
<rect class="run" x="570" y="133" width="16" height="14" rx="2"/>
<text class="c" x="166" y="126">sys.Sleep(0.2)</text>
<text class="s" x="465" y="132" text-anchor="middle">parked on a timer</text>
<text x="560" y="166" text-anchor="end">gives <tspan class="c">"bread is ready"</tspan>, ends, wakes main</text>

<rect class="run" x="182" y="207" width="16" height="14" rx="2"/>
<line class="wait" x1="198" y1="214" x2="360" y2="214"/>
<rect class="run" x="360" y="207" width="16" height="14" rx="2"/>
<text class="c" x="182" y="200">sys.Sleep(0.1)</text>
<text class="s" x="299" y="236" text-anchor="middle">parked on a timer</text>
<text x="382" y="218">gives <tspan class="c">"cake is ready"</tspan>, ends</text>
<line class="ax" x1="150" y1="252" x2="600" y2="252"/>
<line class="ax" x1="150" y1="248" x2="150" y2="256"/><text x="150" y="272" text-anchor="middle">0</text>
<line class="ax" x1="360" y1="248" x2="360" y2="256"/><text x="360" y="272" text-anchor="middle">0.1 s</text>
<line class="ax" x1="570" y1="248" x2="570" y2="256"/><text x="570" y="272" text-anchor="middle">0.2 s</text>
<text class="s" x="14" y="272">time</text>
<text class="s" x="14" y="296">One runs at a time, in the order they became ready; while all wait, the scheduler waits for</text>
<text class="s" x="14" y="313">the first timer. A blue run takes microseconds: it is drawn wider than its time.</text>

<line x1="582" y1="132" x2="590.8" y2="81.9" stroke="#3a5ad9" stroke-width="1.3"/><polygon fill="#3a5ad9" points="592,75 594.6,83.6 586.7,82.2"/>
</svg>
